name: Build and publish SOMNUS CUDA 13

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cuda13:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Free space for large CUDA wheels
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          docker system prune -af || true
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CUDA 13 image (never overwrite latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda13
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/fletchrock/somnus-comfyui:cuda13
            ghcr.io/fletchrock/somnus-comfyui:cuda13-${{ github.sha }}
          cache-from: type=gha,scope=somnus-cuda13
          cache-to: type=gha,mode=max,scope=somnus-cuda13
